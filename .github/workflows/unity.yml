name: Unity build

on:
  workflow_dispatch:
  push:
    paths:
      - 'unity/**'
      - '.github/workflows/unity.yml'

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [WebGL, Android, StandaloneWindows64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: unity/ATHAR/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/ATHAR/Packages/manifest.json') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Free disk space
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      # Needs repository secrets UNITY_LICENSE (Personal licence file contents), UNITY_EMAIL and UNITY_PASSWORD.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/ATHAR
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Athar.EditorTools.AtharBuild.Build
          buildName: ATHAR

      - uses: actions/upload-artifact@v4
        with:
          name: ATHAR-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
