# Local development stack: `docker compose up --build`
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://game:game@postgres:5432/game
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-do-not-use-in-prod-123}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
